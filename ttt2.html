<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Part 2 - Tic Tac Toe</title>
        <style>
            .square {
                display:flex;
                justify-content:center;
                align-items:center;
                font-size:70px;
                font-family:Arial, sans-serif;
                font-weight:bold;
                width:100px;
                height:100px;
                border: 1px solid black;
                background-color:beige;
                cursor:pointer;
            }
            .square:hover {
                background-color:#d9c9a8;
            }
            #board {
                display:grid;
                justify-content:center;
                grid-template-columns: 100px 100px 100px;
                gap:10px;
            }
            h1 {
                font-family:Arial, sans-serif;
                text-align:center;
            }
            #turn {
                text-align:center;
                border:2px solid black;
                width:320px;
                margin:10px auto;
                padding:10px;
                font-family:Arial, sans-serif;
            }
            #message {
                text-align:center;
                width:320px;
                margin:10px auto;
                padding:10px;
                font-family:Arial, sans-serif;
                border:2px solid black;
            }
        </style>
    </head>
    <body>
        <h1>Tic Tac Toe, but better-looking</h1>
        <div id="turn">X's turn</div>
        <div id="board">   
            <script>
                const NUM_SQUARES = 9;
                for (i=0; i<NUM_SQUARES; i++)
                {
                id = "sq"+i;
                document.write( "<div class='square' id='" + id + "'></div>" );
                }
            </script>
        </div>
        <div id="message">
            Game in progress...
        </div>
        <script>
            document.getElementById("sq2").innerText = "X";
            document.getElementById("sq3").innerText = "O";
        </script>
    </body>
</html>
