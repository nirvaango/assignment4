<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Part 4 - Tic Tac Toe</title>
        <style>
            .square {
                display:flex;
                justify-content:center;
                align-items:center;
                font-size:70px;
                font-family:Arial, sans-serif;
                font-weight:bold;
                width:100px;
                height:100px;
                border: 1px solid black;
                background-color:beige;
                cursor:pointer;
            }
            .square:hover {
                background-color:#d9c9a8;
            }
            #board {
                display:grid;
                justify-content:center;
                grid-template-columns: 100px 100px 100px;
                gap:10px;
            }
            h1 {
                font-family:Arial, sans-serif;
                text-align:center;
            }
            #turn {
                text-align:center;
                border:2px solid black;
                width:320px;
                margin:10px auto;
                padding:10px;
                font-family:Arial, sans-serif;
            }
            #message {
                text-align:center;
                width:320px;
                margin:10px auto;
                padding:10px;
                font-family:Arial, sans-serif;
                border:2px solid black;
            }
            #start {
                display:block;
                margin:10px auto;
                background-color:beige;
                border:1px solid black;
                padding:8px 16px;
                font-family: Arial, sans-serif;
                font-weight:bold;
                cursor:pointer;
            }
            #start:hover {
                background-color:#d9c9a8;
            }
        </style>
    </head>
    <body>
        <h1>Tic Tac Toe, but better-looking</h1>
        <div id="turn">Press "Start Game"</div>
        <button id="start">Start Game</button>
        <div id="board">   
            <script>
                const NUM_SQUARES = 9;
                for (i=0; i<NUM_SQUARES; i++)
                {
                id = "sq"+i;
                document.write( "<div class='square' id='" + id + "'></div>" );
                }
            </script>
        </div>
        <div id="message">
            Waiting to start...
        </div>
        <script>

            document.getElementById("start").addEventListener("click", startGame);

            let currentPlayer;
            let gameActive = false;

            // Starts a new game: clears all squares, randomly picks X or O to go first,
            // updates the turn and message boxes, and unlocks the board
            function startGame() {

                gameActive = true;
                for (let i = 0; i < NUM_SQUARES; i++) {
                    document.getElementById("sq"+i).innerText = "";
                }
                if (Math.random() < 0.5) {
                    currentPlayer = "X";
                }
                else {
                    currentPlayer = "O";
                }

                document.getElementById("turn").innerText = currentPlayer + "'s turn";
                document.getElementById("message").innerText = "Game in progress...";

            }

            // Reads the board into the moves array ("-" for empty), builds the 8
            // winConditions strings (3 rows, 3 columns, 2 diagonals), and checks for
            // XXX/OOO (win) or a full board (stalemate). Returns true if the game ended.
            function checkGame() {
                let moves = [];
                document.querySelectorAll(".square").forEach(function (square) {
                    if (square.innerText === "") {
                        moves.push("-");
                    } else {
                        moves.push(square.innerText);
                    }
                });

                // each column, row, and (anti)diagonal
                let winConditions = [
                    moves[0] + moves[1] + moves[2],
                    moves[3] + moves[4] + moves[5],
                    moves[6] + moves[7] + moves[8],
                    moves[0] + moves[3] + moves[6],
                    moves[1] + moves[4] + moves[7],
                    moves[2] + moves[5] + moves[8],
                    moves[0] + moves[4] + moves[8],
                    moves[2] + moves[4] + moves[6]
                ];

                if (winConditions.includes("XXX") || winConditions.includes("OOO")) {
                    document.getElementById("message").innerText = currentPlayer + " wins! Start new game.";
                    document.getElementById("turn").innerText = "Game over";
                    gameActive = false;
                    return true;
                }

                if (!moves.includes("-")) {
                    document.getElementById("message").innerText = "Stalemate! Start new game.";
                    document.getElementById("turn").innerText = "Game over";
                    gameActive = false;
                    return true;
                }

                return false;
            }

            // Runs when a square is clicked: ignores clicks before Start, after game over,
            // or on filled squares; places the symbol, checks for a win/stalemate,
            // and switches turns if the game continues
            function handleClick() {

                if (!gameActive) {
                    return;
                }

                if (document.getElementById("message").innerText === "Invalid choice! Pick another.") {
                    document.getElementById("message").innerText = "Game in progress...";
                }

                if (this.innerText !== "") {
                    document.getElementById("message").innerText = "Invalid choice! Pick another.";
                    return;
                }

                this.innerText = currentPlayer;
                if (checkGame()) {
                    return;
                }

                if (currentPlayer === "X") {
                    currentPlayer = "O";
                }
                else if (currentPlayer === "O") {
                    currentPlayer = "X";
                }

                document.getElementById("turn").innerText = currentPlayer + "'s turn";
            }

            for (let i = 0; i < NUM_SQUARES; i++) {
                document.getElementById("sq" + i).addEventListener("click", handleClick);
            }

        </script>
    </body>
</html>
