<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Part 3 - Tic Tac Toe</title>
        <style>
            .square {
                display:flex;
                justify-content:center;
                align-items:center;
                font-size:70px;
                font-family:Arial, sans-serif;
                font-weight:bold;
                width:100px;
                height:100px;
                border: 1px solid black;
                background-color:beige;
                cursor:pointer;
            }
            .square:hover {
                background-color:#d9c9a8;
            }
            #board {
                display:grid;
                justify-content:center;
                grid-template-columns: 100px 100px 100px;
                gap:10px;
            }
            h1 {
                font-family:Arial, sans-serif;
                text-align:center;
            }
            #turn {
                text-align:center;
                border:2px solid black;
                width:320px;
                margin:10px auto;
                padding:10px;
                font-family:Arial, sans-serif;
            }
            #message {
                text-align:center;
                width:320px;
                margin:10px auto;
                padding:10px;
                font-family:Arial, sans-serif;
                border:2px solid black;
            }
            #start {
                display:block;
                margin:10px auto;
                background-color:beige;
                border:1px solid black;
                padding:8px 16px;
                font-family: Arial, sans-serif;
                font-weight:bold;
                cursor:pointer;
            }
            #start:hover {
                background-color:#d9c9a8;
            }
        </style>
    </head>
    <body>
        <h1>Tic Tac Toe, but better-looking</h1>
        <div id="turn">Press "Start Game"</div>
        <button id="start">Start Game</button>
        <div id="board">   
            <script>
                const NUM_SQUARES = 9;
                for (i=0; i<NUM_SQUARES; i++)
                {
                id = "sq"+i;
                document.write( "<div class='square' id='" + id + "'></div>" );
                }
            </script>
        </div>
        <div id="message">
            Waiting to start...
        </div>
        <script>

            document.getElementById("start").addEventListener("click", startGame);

            let currentPlayer;
            let gameActive = false;

            // Starts a new game: clears all squares, randomly picks X or O to go first,
            // updates the turn and message boxes, and unlocks the board
            function startGame() {

                gameActive = true;
                for (let i = 0; i < NUM_SQUARES; i++) {
                    document.getElementById("sq"+i).innerText = "";
                }
                if (Math.random() < 0.5) {
                    currentPlayer = "X";
                }
                else {
                    currentPlayer = "O";
                }

                document.getElementById("turn").innerText = currentPlayer + "'s turn";
                document.getElementById("message").innerText = "Game in progress...";

            }

            // Runs when a square is clicked: ignores clicks before Start or on filled squares,
            // places the current player's symbol, shows the square number, and switches turns
            function handleClick() {

                if (!gameActive) {
                    return;
                }

                if (document.getElementById("message").innerText === "Invalid choice! Pick another.") {
                    document.getElementById("message").innerText = "Game in progress...";
                }

                if (this.innerText !== "") {
                    document.getElementById("message").innerText = "Invalid choice! Pick another.";
                    return;
                }

                this.innerText = currentPlayer;
                alert(this.id.slice(2));

                if (currentPlayer === "X") {
                    currentPlayer = "O";
                }
                else if (currentPlayer === "O") {
                    currentPlayer = "X";
                }

                document.getElementById("turn").innerText = currentPlayer + "'s turn";
            }

            for (let i = 0; i < NUM_SQUARES; i++) {
                document.getElementById("sq" + i).addEventListener("click", handleClick);
            }

        </script>
    </body>
</html>
